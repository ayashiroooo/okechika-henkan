<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桶地下文字変換</title>

    <!-- CSSを読み込む -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>桶地下文字変換サイト by Ranchan</h1>

    <h3>桶地下サイトからコピーして貼り付けることで日本語に変換できます。現在更新中のためうまく復元できない場合があります。</h3>
    <h3>対応が確定していない文字はうしろに「?」が付いています。また、未発見の文字は桶地下サイトでの内部的な文字がそのまま表示されます。</h3>

    <div class="container">

        <h2>変換前</h2>

        <textarea id="inputText" placeholder="ここに文章を入力してください"></textarea>

        <button onclick="convertText()">変換</button>

        <h2>変換後</h2>

        <textarea id="outputText" readonly></textarea>

    </div>

    <!-- JavaScriptを読み込む -->
    <script src="script.js"></script>

</body>
</html>
